<title>מסגרת הציונות הדתית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;800&family=Assistant:wght@400;600&display=swap">
<style>
/* Layout: one narrow column — title, live square preview, two capture buttons, save */
:root{
  --bg:#eef4f7;
  --surface:#ffffff;
  --ink:#16314a;
  --muted:#4f6b80;
  --brand:#2f6a8f;
  --brand-ink:#ffffff;
  --line:#c9dbe5;
  --sky:#7ab3c6;
  --display:"Heebo","Arial Hebrew",Arial,sans-serif;
  --body:"Assistant","Arial Hebrew",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1c26;--surface:#162a38;--ink:#e6f0f5;--muted:#9cb6c6;--brand:#4b8db4;--brand-ink:#ffffff;--line:#27455a;--sky:#3d6f84;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1c26;--surface:#162a38;--ink:#e6f0f5;--muted:#9cb6c6;--brand:#4b8db4;--brand-ink:#ffffff;--line:#27455a;--sky:#3d6f84;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:20px 32px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:800;font-size:1.75rem;line-height:1.15;margin:0;text-wrap:balance}
.lead{margin:0;color:var(--muted)}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:1/1;border-radius:6px;overflow:hidden;background:#7eb3c3;box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(10,40,60,.45);touch-action:none;cursor:grab}
.stage.dragging{cursor:grabbing}
canvas{display:block;width:100%;height:100%}
.reset{position:absolute;top:10px;left:10px;z-index:3;display:flex;align-items:center;gap:6px;appearance:none;border:0;border-radius:999px;padding:8px 12px;background:rgba(10,35,55,.72);color:#fff;font-family:var(--display);font-weight:500;font-size:.9rem;cursor:pointer;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.reset svg{width:16px;height:16px}
.reset:focus-visible{outline:3px solid #fff;outline-offset:2px}
.circle{position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:1;box-shadow:0 0 0 999px rgba(10,30,45,.14);outline:1.5px dashed rgba(255,255,255,.6);outline-offset:-1px}
.hint{position:absolute;inset-inline:0;top:22%;text-align:center;font-family:var(--display);font-weight:500;color:#fff;font-size:1.05rem;text-shadow:0 1px 3px rgba(0,0,0,.35);pointer-events:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--display);font-weight:500;font-size:1.05rem;padding:14px 12px;border-radius:6px;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:800}
.btn:focus-visible,input:focus-visible+.btn{outline:3px solid var(--sky);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:default}
.pickbtn{position:relative;overflow:hidden}
.pickbtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px;z-index:2}
.pickbtn:focus-within{outline:3px solid var(--sky);outline-offset:2px}
.sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,25,38,.55);padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px))}
.sheet-card{width:100%;max-width:420px;background:var(--surface);color:var(--ink);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px -20px rgba(0,0,0,.5)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet-head h2{margin:0;font-family:var(--display);font-weight:800;font-size:1.2rem}
.x{appearance:none;border:0;background:transparent;color:var(--muted);font-size:1.6rem;line-height:1;padding:4px 8px;cursor:pointer}
.sheet img{width:100%;max-height:50vh;object-fit:contain;border-radius:6px;display:block}
@media (min-width:600px){.sheet{align-items:center}}
.status{min-height:1.4em;margin:0;color:var(--muted);font-size:.95rem;text-align:center}
svg{width:20px;height:20px;flex:none}
</style>
</head>
<body>

<div class="wrap" dir="rtl" lang="he">
  <h1>מצטרפים לציונות הדתית</h1>
  <p class="lead">צלמו או העלו תמונה, גררו והגדילו עד שהפנים במקום, ושמרו תמונת פרופיל מרובעת עם הפס והפתק.</p>

  <div class="stage" id="stage">
    <canvas id="cv" width="1080" height="1080" aria-label="תצוגה מקדימה של תמונת הפרופיל"></canvas>
    <button class="reset" id="reset" hidden aria-label="החזרה למצב ההתחלתי">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></svg>
      איפוס
    </button>
    <div class="circle" aria-hidden="true"></div>
    <div class="hint" id="hint">התמונה שלכם תופיע כאן</div>
  </div>

  <div class="row">
    <label class="btn primary pickbtn">
      <input type="file" id="cam" accept="image/*" capture="user" aria-label="צילום">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      צילום
    </label>
    <label class="btn pickbtn">
      <input type="file" id="pick" accept="image/*" aria-label="מהגלריה">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg>
      מהגלריה
    </label>
  </div>


  <button class="btn primary" id="save" disabled>שמירת התמונה</button>
  <p class="status" id="status" role="status"></p>

</div>

<div class="sheet" id="sheet" hidden dir="rtl" lang="he" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-card">
    <div class="sheet-head">
      <h2 id="sheetTitle">התמונה מוכנה</h2>
      <button class="x" id="closeSheet" aria-label="סגירה">×</button>
    </div>
    <img id="out" alt="תמונת הפרופיל המוכנה">
    <div class="row">
      <button class="btn primary" id="dlBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
        להורדה
      </button>
      <button class="btn" id="shareBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg>
        שתף
      </button>
    </div>
    <p class="status" id="sheetStatus" role="status"></p>
  </div>
</div>

const S = 1080, U = S/800;           // frame drawn in 800-unit design space, output 1080px
const BAR_TOP = 519;
const G = {top:385, w:537, h:312, cL:20, cR:535};
const G_MIN = -G.cL, G_MAX = 800 - G.cR, G_CENTER = (800 - (G.cR - G.cL))/2 - G.cL;
const SNAP = 7;
const G_DEFAULT = 41;   // default position of note+logo (design units)

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage'), hint = document.getElementById('hint');
const saveBtn = document.getElementById('save');
const statusEl = document.getElementById('status'), out = document.getElementById('out');
const sheet = document.getElementById('sheet'), sheetStatus = document.getElementById('sheetStatus');

const barImg = new Image(), groupImg = new Image();
barImg.onload = groupImg.onload = () => draw();
barImg.src = BAR_SRC; groupImg.src = GROUP_SRC;

let photo = null, base = 1, z = 1, cx = 0, cy = 0; // cx,cy = photo point at stage centre (photo px)
let gx = G_DEFAULT, groupDrag = false;

function clamp(){
  if(!photo) return;
  const s = base*z;
  const fit = (c, len) => {
    const W = len*s;
    let lo, hi;
    if(W >= S){ lo = S - W; hi = 0; } else { lo = -W/2; hi = S - W/2; }
    const left = Math.min(Math.max(S/2 - c*s, lo), hi);
    return (S/2 - left)/s;
  };
  cx = fit(cx, photo.width); cy = fit(cy, photo.height);
}
let init = null;
const resetBtn = document.getElementById('reset');
const isCentered = () => Math.abs(gx - G_CENTER) < 0.01;
function updateReset(){
  const photoMoved = photo && init && (Math.abs(z-init.z) > 0.001 || Math.abs(cx-init.cx) > 0.5 || Math.abs(cy-init.cy) > 0.5);
  resetBtn.hidden = !(photoMoved || Math.abs(gx - G_DEFAULT) > 0.01);
}
resetBtn.addEventListener('pointerdown', e => e.stopPropagation());
resetBtn.addEventListener('click', e => {
  e.stopPropagation();
  if(init){ z = init.z; cx = init.cx; cy = init.cy; }
  gx = G_DEFAULT; draw();
});

function draw(guide){
  updateReset();
  ctx.fillStyle = '#7eb3c3'; ctx.fillRect(0,0,S,S);
  if(photo){
    const s = base*z;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(photo, S/2 - cx*s, S/2 - cy*s, photo.width*s, photo.height*s);
  }
  if(barImg.naturalWidth) ctx.drawImage(barImg, 0, BAR_TOP*U, S, (800-BAR_TOP)*U);
  if(groupImg.naturalWidth) ctx.drawImage(groupImg, gx*U, G.top*U, G.w*U, G.h*U);
  if(guide && isCentered()){
    ctx.save();
    ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 4; ctx.setLineDash([18,12]);
    ctx.beginPath(); ctx.moveTo(S/2, 0); ctx.lineTo(S/2, S); ctx.stroke();
    ctx.setLineDash([]);
    const label = 'באמצע ✓';
    ctx.font = '600 44px Heebo, Arial, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const w = ctx.measureText(label).width + 44;
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(S/2 - w/2, 40, w, 72, 36) : ctx.rect(S/2 - w/2, 40, w, 72); ctx.fill();
    ctx.fillStyle = '#16314a'; ctx.fillText(label, S/2, 77);
    ctx.restore();
  }
}

function load(file){
  if(!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    photo = img; base = S / Math.min(img.width, img.height); z = 1;
    cx = img.width/2; cy = img.height*0.45; clamp(); init = {z, cx, cy};
    saveBtn.disabled = false;
    hint.hidden = true; statusEl.textContent = 'גררו את התמונה כדי להזיז, צבטו כדי להגדיל או להקטין, וגררו את הפתק והלוגו ימינה או שמאלה.';
    draw();
  };
  img.onerror = () => { statusEl.textContent = 'לא הצלחנו לפתוח את הקובץ. נסו תמונה בפורמט JPG או PNG.'; };
  img.src = url;
}
document.getElementById('cam').addEventListener('change', e => { load(e.target.files[0]); e.target.value=''; });
document.getElementById('pick').addEventListener('change', e => { load(e.target.files[0]); e.target.value=''; });

function setZoom(nz){ z = Math.min(6, Math.max(0.15, nz)); clamp(); draw(); }

// drag + pinch; touching the bottom bar or the note/logo moves the group sideways
const pts = new Map(); let pinch0 = null, rawGx = gx;
function unit(){ return S / stage.getBoundingClientRect().width; }
function toDesign(e){ const r = stage.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*800, y:(e.clientY-r.top)/r.height*800}; }
function hitsGroup(p){
  if(p.y >= BAR_TOP) return true;
  return p.y >= G.top && p.x >= gx + G.cL && p.x <= gx + G.cR;
}
function moveGroup(dxDesign){
  rawGx = Math.min(G_MAX, Math.max(G_MIN, rawGx + dxDesign));
  const was = isCentered();
  gx = Math.abs(rawGx - G_CENTER) < SNAP ? G_CENTER : rawGx;
  if(!was && isCentered() && navigator.vibrate) { try{ navigator.vibrate(12); }catch(_){} }
  draw(true);
}
stage.addEventListener('pointerdown', e => {
  const p = toDesign(e);
  if(pts.size === 0) groupDrag = hitsGroup(p);
  if(!photo && !groupDrag) return;
  stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  stage.classList.add('dragging');
  if(groupDrag){ rawGx = gx; draw(true); }
  if(pts.size === 2 && photo){ groupDrag = false; draw(); const [a,b] = [...pts.values()]; pinch0 = {d: Math.hypot(a.x-b.x, a.y-b.y), z}; }
});
stage.addEventListener('pointermove', e => {
  if(!pts.has(e.pointerId)) return;
  const prev = pts.get(e.pointerId), now = {x:e.clientX, y:e.clientY};
  pts.set(e.pointerId, now);
  if(pts.size === 1 && groupDrag){
    const r = stage.getBoundingClientRect();
    moveGroup((now.x-prev.x)/r.width*800);
  } else if(pts.size === 1 && photo){
    const k = unit()/(base*z);
    cx -= (now.x-prev.x)*k; cy -= (now.y-prev.y)*k; clamp(); draw();
  } else if(pts.size === 2 && pinch0){
    const [a,b] = [...pts.values()];
    setZoom(pinch0.z * Math.hypot(a.x-b.x, a.y-b.y) / pinch0.d);
  }
});
function up(e){
  pts.delete(e.pointerId); if(pts.size < 2) pinch0 = null;
  if(!pts.size){ stage.classList.remove('dragging'); if(groupDrag){ groupDrag = false; setTimeout(() => { if(!pts.size) draw(); }, 600); } }
}
stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
stage.addEventListener('wheel', e => { if(!photo) return; e.preventDefault(); setZoom(z * (e.deltaY < 0 ? 1.06 : 1/1.06)); }, {passive:false});

// כתובת האתר שתישלח בשיתוף. אם העמוד פתוח מאתר (https) לוקחים את הכתובת שלו אוטומטית.
const SITE_URL = 'https://arik770.github.io/tzionut-frame/';
function siteLink(){
  if(/^https?:$/.test(location.protocol)) return location.href.split('#')[0].split('?')[0];
  return SITE_URL;
}
const FILENAME = 'profile-tziyonut-datit.jpg';
const SHARE_TEXT = 'גם אני מצטרף לציונות הדתית! תעשו גם אתם תמונת פרופיל כאן:';
let current = null; // {blob, url}

saveBtn.addEventListener('click', () => {
  draw();
  cv.toBlob(blob => {
    if(!blob) return;
    if(current) URL.revokeObjectURL(current.url);
    current = {blob, url: URL.createObjectURL(blob)};
    out.src = current.url;
    sheetStatus.textContent = '';
    sheet.hidden = false;
  }, 'image/jpeg', 0.92);
});

function closeSheet(){ sheet.hidden = true; }
document.getElementById('closeSheet').addEventListener('click', closeSheet);
sheet.addEventListener('click', e => { if(e.target === sheet) closeSheet(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !sheet.hidden) closeSheet(); });

document.getElementById('dlBtn').addEventListener('click', () => {
  if(!current) return;
  const a = document.createElement('a'); a.href = current.url; a.download = FILENAME;
  document.body.appendChild(a); a.click(); a.remove();
  sheetStatus.textContent = 'התמונה ירדה למכשיר. באייפון, אם לא נשמרה: לחיצה ארוכה על התמונה ← "הוסף לתמונות".';
});

document.getElementById('shareBtn').addEventListener('click', async () => {
  if(!current) return;
  const link = siteLink();
  const file = new File([current.blob], FILENAME, {type:'image/jpeg'});
  const text = link ? SHARE_TEXT + '\n' + link : SHARE_TEXT.replace(/ כאן:$/, '.');
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], text});
    } else if(navigator.share){
      await navigator.share(link ? {text, url: link} : {text});
    } else {
      await navigator.clipboard.writeText(text);
      sheetStatus.textContent = 'השיתוף לא נתמך בדפדפן הזה. הקישור הועתק, אפשר להדביק אותו בהודעה.';
    }
  }catch(err){
    if(err && err.name !== 'AbortError') sheetStatus.textContent = 'לא הצלחנו לפתוח את השיתוף. אפשר להוריד את התמונה ולשלוח אותה ידנית.';
  }
});
draw();
</script>
